<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>七台河婆罗门人生模拟</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --coal-dark: #1A1713;
      --coal-medium: #3A352E;
      --lake-blue: #2D4A64;
      --lake-light: #6B87A0;
      --pine-green: #354033;
      --gold-accent: #A67C52;
      --paper: #F3EFE7;
      --shadow: 0 8px 32px rgba(0,0,0,0.15);
      --blur: blur(12px);
    }

    body {
      font-family: "Noto Serif SC", serif;
      background: linear-gradient(160deg, var(--paper) 0%, #E9E4DB 100%);
      color: var(--coal-dark);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48ZmlsdGVyIGlkPSJub2lzZSI+PGZlVHVyYnVsZW5jZSB0eXBlPSJmcmFjdGFsTm9pc2UiIGJhc2VGcmVxdWVuY3k9IjAuOTgiIG51bU9jdGF2ZXM9IjMiIHN0aXRjaFRpbGVzPSJzdGl0Y2giIC8+PC9maWx0ZXI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsdGVyPSJ1cmwoI25vaXNlKSIgb3BhY2l0eT0iMC4wMyIgLz48L3N2Zz4=');
      opacity: 0.6;
      z-index: -1;
    }

    .container {
      display: grid;
      grid-template-columns: 280px 1fr 320px;
      gap: 24px;
      max-width: 1600px;
      margin: 0 auto;
      padding: 32px;
      min-height: 100vh;
    }

    .panel-left {
      background: rgba(255,255,255,0.7);
      backdrop-filter: var(--blur);
      border-radius: 20px;
      padding: 28px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.4);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel-left h2 {
      font-family: "Playfair Display", serif;
      font-size: 20px;
      color: var(--coal-dark);
      border-left: 3px solid var(--gold-accent);
      padding-left: 12px;
      margin-bottom: 8px;
    }

    .attr-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      font-size: 14px;
    }

    .attr-bar {
      width: 120px;
      height: 6px;
      background: rgba(0,0,0,0.08);
      border-radius: 99px;
      overflow: hidden;
    }

    .attr-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--lake-blue), var(--lake-light));
      border-radius: 99px;
      transition: width 0.5s ease;
    }

    .main {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .header {
      text-align: center;
      padding: 20px;
    }

    .header h1 {
      font-family: "Playfair Display", serif;
      font-size: 36px;
      letter-spacing: 2px;
      color: var(--coal-dark);
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      color: var(--coal-medium);
      letter-spacing: 1px;
    }

    .card {
      background: rgba(255,255,255,0.75);
      backdrop-filter: var(--blur);
      border-radius: 24px;
      padding: 40px;
      box-shadow: var(--shadow);
      min-height: 520px;
      position: relative;
      border: 1px solid rgba(255,255,255,0.5);
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .character-img {
      width: 280px;
      height: 380px;
      margin: 0 auto;
      border-radius: 16px;
      object-fit: cover;
      box-shadow: 0 12px 28px rgba(0,0,0,0.2);
      transition: all 0.4s ease;
    }

    .character-img:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 36px rgba(0,0,0,0.25);
    }

    .story-text {
      font-size: 16px;
      line-height: 1.8;
      color: var(--coal-dark);
      text-align: justify;
      white-space: pre-line;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 12px;
    }

    .choice-btn {
      padding: 16px 24px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(90deg, var(--lake-blue), var(--lake-light));
      color: white;
      font-family: "Noto Serif SC", serif;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(45,74,100,0.2);
    }

    .choice-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(45,74,100,0.3);
    }

    .choice-btn:active {
      transform: translateY(0);
    }

    .panel-right {
      background: rgba(255,255,255,0.7);
      backdrop-filter: var(--blur);
      border-radius: 20px;
      padding: 28px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.4);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .phase-tag {
      display: inline-block;
      padding: 6px 14px;
      background: var(--pine-green);
      color: white;
      font-size: 12px;
      border-radius: 99px;
      margin-bottom: 12px;
    }

    .place-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .place-tag {
      padding: 6px 10px;
      background: rgba(166,124,82,0.1);
      color: var(--gold-accent);
      font-size: 12px;
      border-radius: 8px;
    }

    .start-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(26,23,19,0.85);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity 0.6s ease;
    }

    .start-card {
      background: var(--paper);
      border-radius: 24px;
      padding: 60px 80px;
      max-width: 600px;
      text-align: center;
      box-shadow: var(--shadow);
      animation: fadeUp 0.8s ease forwards;
    }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(40px); }
      to { opacity:1; transform:translateY(0); }
    }

    .start-card h1 {
      font-family: "Playfair Display", serif;
      font-size: 38px;
      color: var(--coal-dark);
      margin-bottom: 12px;
    }

    .start-card p {
      font-size: 15px;
      color: var(--coal-medium);
      margin-bottom: 32px;
    }

    .input-group {
      margin-bottom: 24px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      color: var(--coal-medium);
      margin-bottom: 8px;
      text-align: left;
    }

    .input-group input, .input-group select {
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.1);
      background: white;
      font-size: 15px;
      font-family: "Noto Serif SC", serif;
      outline: none;
      transition: border 0.3s ease;
    }

    .input-group input:focus, .input-group select:focus {
      border-color: var(--lake-blue);
    }

    .start-btn {
      padding: 16px 40px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(90deg, var(--lake-blue), var(--lake-light));
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 12px;
    }

    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(45,74,100,0.3);
    }

    .ending-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(26,23,19,0.9);
      backdrop-filter: blur(15px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    .ending-card {
      background: var(--paper);
      border-radius: 24px;
      padding: 60px;
      max-width: 800px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .ending-card h2 {
      font-family: "Playfair Display", serif;
      font-size: 32px;
      color: var(--coal-dark);
      margin-bottom: 20px;
    }

    .ending-desc {
      font-size: 16px;
      line-height: 1.8;
      color: var(--coal-medium);
      margin-bottom: 30px;
      text-align: left;
    }

    .restart-btn {
      padding: 16px 40px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(90deg, var(--gold-accent), var(--lake-light));
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    @media (max-width:1200px) {
      .container { grid-template-columns: 1fr; }
      .panel-left, .panel-right { display: none; }
    }
  </style>
</head>
<body>
  <!-- 开始界面 -->
  <div class="start-screen" id="startScreen">
    <div class="start-card">
      <h1>七台河婆罗门人生模拟</h1>
      <p>出生桃山湖畔，踏入煤城顶层圈层，你的人生由选择书写</p>
      <div class="input-group">
        <label>你的名字</label>
        <input type="text" id="playerName" placeholder="请输入中文名">
      </div>
      <div class="input-group">
        <label>性别</label>
        <select id="playerGender">
          <option value="boy">男生</option>
          <option value="girl">女生</option>
        </select>
      </div>
      <div class="input-group">
        <label>家庭出身</label>
        <select id="familyType">
          <option value="mine">民营煤业大佬</option>
          <option value="longmei">龙煤集团高管</option>
          <option value="gov">市直机关核心领导</option>
        </select>
      </div>
      <button class="start-btn" onclick="startGame()">开始人生</button>
    </div>
  </div>

  <!-- 结局界面 -->
  <div class="ending-screen" id="endingScreen">
    <div class="ending-card">
      <h2 id="endingTitle">结局</h2>
      <div class="ending-desc" id="endingDesc"></div>
      <button class="restart-btn" onclick="restartGame()">重新开启人生</button>
    </div>
  </div>

  <div class="container">
    <!-- 左侧属性面板 -->
    <div class="panel-left">
      <h2>角色属性</h2>
      <div class="attr-item">
        <span>家境圈层</span>
        <div class="attr-bar"><div class="attr-fill" id="attrWealth" style="width:95%"></div></div>
      </div>
      <div class="attr-item">
        <span>学业成绩</span>
        <div class="attr-bar"><div class="attr-fill" id="attrStudy" style="width:60%"></div></div>
      </div>
      <div class="attr-item">
        <span>人脉资源</span>
        <div class="attr-bar"><div class="attr-fill" id="attrSocial" style="width:90%"></div></div>
      </div>
      <div class="attr-item">
        <span>心态压力</span>
        <div class="attr-bar"><div class="attr-fill" id="attrStress" style="width:40%"></div></div>
      </div>
      <div class="attr-item">
        <span>健康状态</span>
        <div class="attr-bar"><div class="attr-fill" id="attrHealth" style="width:75%"></div></div>
      </div>
    </div>

    <!-- 中间主剧情 -->
    <div class="main">
      <div class="header">
        <h1>七台河婆罗门人生模拟</h1>
        <p>桃山湖 · 仙洞山 · 煤城顶层叙事</p>
      </div>
      <div class="card">
        <img src="https://picsum.photos/id/64/280/380" alt="角色立绘" class="character-img" id="charImg">
        <div class="story-text" id="storyText">
你出生在桃山湖畔银泉小区的楼王里，红松实木窗框嵌着三层保温玻璃，推窗就是波光粼粼的桃山湖，抬眼就是仙洞山漫山叠翠的林海。
你的邻居是市政府核心领导、龙煤高管、手握数座矿井的煤业大佬，而你家，正是其中之一。
这是属于你的，七台河婆罗门人生。
        </div>
        <div class="choices" id="choices">
          <button class="choice-btn" onclick="makeChoice(1)">前往市政府幼儿园</button>
          <button class="choice-btn" onclick="makeChoice(2)">随父亲下矿巡检</button>
        </div>
      </div>
    </div>

    <!-- 右侧信息面板 -->
    <div class="panel-right">
      <div>
        <span class="phase-tag" id="phaseTag">初始阶段 · 出生</span>
        <h2>当前信息</h2>
        <p style="margin-top:12px; font-size:14px; line-height:1.6;">
          姓名：<span id="showName">待创建</span><br>
          家庭：<span id="showFamily">待选择</span><br>
          年龄：<span id="showAge">0</span> 岁<br>
          地点：<span id="showPlace">银泉小区 · 桃山湖畔</span>
        </p>
      </div>
      <div>
        <h2>地标解锁</h2>
        <div class="place-list" id="placeList">
          <span class="place-tag">银泉小区</span>
          <span class="place-tag">桃山湖</span>
          <span class="place-tag">仙洞山</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 玩家数据
    const player = {
      name: "",
      gender: "boy",
      family: "",
      phase: 0,
      age: 0,
      attributes: { wealth:95, study:60, social:90, stress:40, health:75 },
      places: ["银泉小区","桃山湖","仙洞山"]
    };

    // 立绘库
    const charImages = {
      boy: {
        birth: "https://picsum.photos/id/64/280/380",
        kindergarten: "https://picsum.photos/id/91/280/380",
        primary: "https://picsum.photos/id/104/280/380",
        middle: "https://picsum.photos/id/168/280/380",
        high: "https://picsum.photos/id/222/280/380"
      },
      girl: {
        birth: "https://picsum.photos/id/1025/280/380",
        kindergarten: "https://picsum.photos/id/1011/280/380",
        primary: "https://picsum.photos/id/1027/280/380",
        middle: "https://picsum.photos/id/1069/280/380",
        high: "https://picsum.photos/id/1059/280/380"
      }
    };

    // 8种结局
    const endings = [
      {
        id:1, title:"【顶层婆罗门】",
        desc:"你考入顶尖名校，留学海外，留在一线城市成为金融精英，彻底脱离矿区，成为家族中最耀眼的存在，永远告别了七台河的煤烟与题海。"
      },
      {
        id:2, title:"【守业继承者】",
        desc:"你放弃远方，回到七台河接管家族煤矿/企业，成为新一代煤城大佬，守住父辈的江山，成为桃山区最有话语权的人。"
      },
      {
        id:3, title:"【体制天花板】",
        desc:"你成功考公进入市直核心部门，走上仕途，凭借家族人脉一路高升，成为七台河体制内的年轻骨干。"
      },
      {
        id:4, title:"【教育赢家】",
        desc:"你以高分考入985/211名校，走学术路线，成为大学教授或科研人才，用知识改写命运，留在大城市安稳一生。"
      },
      {
        id:5, title:"【精神出逃】",
        desc:"你厌倦了精英高压，放弃圈层与补课，选择普通的生活，去南方小城开一家小店，平凡但自由快乐。"
      },
      {
        id:6, title:"【高压崩溃】",
        desc:"长期的补课与高压让你心态崩盘，成绩一落千丈，最终只能进入普通院校，人生轨迹彻底滑落。"
      },
      {
        id:7, title:"【圈层滑落】",
        desc:"你放弃重点学校与补课，脱离顶层圈层，最终只能留在普通岗位，从婆罗门跌落成普通小城青年。"
      },
      {
        id:8, title:"【小城安稳】",
        desc:"你留在七台河，进入体制内或安稳企业，娶妻生子，过着平淡富足的中产生活，守着桃山湖的风度过一生。"
      }
    ];

    // 开始游戏
    function startGame() {
      const nameInput = document.getElementById("playerName");
      if (!nameInput.value.trim()) { alert("请输入名字！"); return; }
      
      player.name = nameInput.value.trim();
      player.gender = document.getElementById("playerGender").value;
      player.family = document.getElementById("familyType").options[document.getElementById("familyType").selectedIndex].text;
      
      document.getElementById("showName").innerText = player.name;
      document.getElementById("showFamily").innerText = player.family;
      document.getElementById("charImg").src = charImages[player.gender].birth;
      
      document.getElementById("startScreen").style.opacity = 0;
      setTimeout(() => {
        document.getElementById("startScreen").style.display = "none";
      }, 600);
      saveGame();
    }

    // 选择逻辑
    function makeChoice(choice) {
      const story = document.getElementById("storyText");
      const img = document.getElementById("charImg");
      const phaseTag = document.getElementById("phaseTag");
      const age = document.getElementById("showAge");
      const place = document.getElementById("showPlace");

      switch(player.phase) {
        // 出生阶段
        case 0:
          player.age = 3;
          player.phase = 1;
          if(choice ===1) {
            story.innerText = `你进入了市政府幼儿园，这里光有钱未必能挤入。同班孩子的父母都是市里四套班子、龙煤高管、矿主世家。周末家长会带你沿桃山湖绿道散步，短道速滑馆、博物馆都在不远处。`;
            player.attributes.social +=5;
          } else {
            story.innerText = `你跟着父亲去矿区巡检，新兴、茄子河的矿井连着好几口，工人们笑着喊你“小老板”。巷道里混着煤香的风，让你从小就明白家里的底气。`;
            player.attributes.wealth +=5;
          }
          img.src = charImages[player.gender].kindergarten;
          phaseTag.innerText = "幼儿阶段 · 市政府幼儿园";
          age.innerText = "3";
          place.innerText = "市政府幼儿园";
          document.getElementById("choices").innerHTML = `<button class="choice-btn" onclick="makeChoice(3)">升入第九小学</button>`;
          break;

        // 小学阶段
        case 1:
          player.age = 7;
          player.phase = 2;
          story.innerText = `你进入七台河老牌重点第九小学，班里都是市直机关、龙煤、矿企子弟。每天早餐是鲜奶馆的牛奶配牛肉馅饼，运动会曾在市体育中心举办，后来因煤炭行情回到水泥操场。`;
          img.src = charImages[player.gender].primary;
          phaseTag.innerText = "小学阶段 · 第九小学";
          age.innerText = "7";
          place.innerText = "第九小学";
          player.places.push("第九小学","营养早餐鲜奶馆");
          renderPlaces();
          document.getElementById("choices").innerHTML = `
            <button class="choice-btn" onclick="makeChoice(4)">努力补课，冲刺九中</button>
            <button class="choice-btn" onclick="makeChoice(5)">放松玩耍，拒绝内卷</button>
          `;
          break;

        // 初中选择
        case 2:
          player.age = 13;
          player.phase = 3;
          if(choice ===4) {
            story.innerText = `你成功考入第九中学，家搬到七号公馆，周末排满奥数、英语、钢琴班，哈尔滨名师一节课的费用，对你家只是矿上一天的流水。你开始鄙夷桃山区外的学校与圈层。`;
            player.attributes.study +=25;
            player.attributes.stress +=30;
          } else {
            story.innerText = `你拒绝疯狂补课，虽然也进入九中，但成绩中等，偶尔和同学去老双华吃手擀面，偷溜出校玩，压力小了很多，但成绩逐渐落后。`;
            player.attributes.study -=10;
            player.attributes.stress -=15;
            player.attributes.health +=10;
          }
          img.src = charImages[player.gender].middle;
          phaseTag.innerText = "初中阶段 · 第九中学";
          age.innerText = "13";
          place.innerText = "第九中学 · 七号公馆";
          player.places.push("第九中学","七号公馆","老双华");
          renderPlaces();
          document.getElementById("choices").innerHTML = `<button class="choice-btn" onclick="makeChoice(6)">冲刺新一中</button>`;
          break;

        // 高中阶段
        case 3:
          player.age = 16;
          player.phase = 4;
          story.innerText = `你考入新一中，妈妈全款买下陪读大平层全职陪读。每晚哈尔滨名师上门补课，包机、专车请名师，补课到凌晨。你见过无数同学崩溃，自己也在题海与压力中麻木。`;
          img.src = charImages[player.gender].high;
          phaseTag.innerText = "高中阶段 · 新一中";
          age.innerText = "16";
          place.innerText = "新一中 · 陪读房";
          player.places.push("新一中","澳洲肥牛");
          renderPlaces();
          document.getElementById("choices").innerHTML = `
            <button class="choice-btn" onclick="makeChoice(7)">全力冲刺高考</button>
            <button class="choice-btn" onclick="makeChoice(8)">放弃内卷，选择躺平</button>
            <button class="choice-btn" onclick="makeChoice(9)">听从安排，准备接班</button>
          `;
          break;

        // 高考抉择→结局
        case 4:
          player.phase = 5;
          let ending;
          if(choice ===7) {
            player.attributes.study +=30;
            player.attributes.stress +=40;
            ending = player.attributes.study >=85 ? 1 : 4;
          } else if(choice ===8) {
            player.attributes.stress -=50;
            player.attributes.health +=20;
            ending = player.attributes.wealth >=90 ? 8 : 5;
          } else if(choice ===9) {
            ending = player.family.includes("煤业") ? 2 : 3;
          } else {
            ending = 7;
          }
          if(player.attributes.stress >=90) ending =6;
          showEnding(ending);
          break;
      }
      updateAttr();
      saveGame();
    }

    // 更新属性面板
    function updateAttr() {
      document.getElementById("attrWealth").style.width = player.attributes.wealth+"%";
      document.getElementById("attrStudy").style.width = player.attributes.study+"%";
      document.getElementById("attrSocial").style.width = player.attributes.social+"%";
      document.getElementById("attrStress").style.width = player.attributes.stress+"%";
      document.getElementById("attrHealth").style.width = player.attributes.health+"%";
    }

    // 渲染地标
    function renderPlaces() {
      const list = document.getElementById("placeList");
      list.innerHTML = "";
      player.places.forEach(item => {
        list.innerHTML += `<span class="place-tag">${item}</span>`;
      });
    }

    // 显示结局
    function showEnding(id) {
      const end = endings.find(e => e.id === id);
      document.getElementById("endingTitle").innerText = end.title;
      document.getElementById("endingDesc").innerText = end.desc;
      document.getElementById("endingScreen").style.display = "flex";
    }

    // 保存游戏
    function saveGame() {
      localStorage.setItem("qitaiheGame", JSON.stringify(player));
    }

    // 重新开始
    function restartGame() {
      localStorage.removeItem("qitaiheGame");
      window.location.reload();
    }

    // 加载存档
    window.onload = function() {
      const save = localStorage.getItem("qitaiheGame");
      if(save) {
        const data = JSON.parse(save);
        Object.assign(player, data);
        document.getElementById("showName").innerText = player.name;
        document.getElementById("showFamily").innerText = player.family;
        document.getElementById("showAge").innerText = player.age;
        updateAttr();
        renderPlaces();
        document.getElementById("startScreen").style.display = "none";
      }
    }
  </script>
</body>
</html>
